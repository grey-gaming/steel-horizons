[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steel-horizons-client"
version = "0.1.0"
description = "Minimal Python client for the Steel Horizons engine REST API"
requires-python = ">=3.10"
dependencies = [
    "httpx >= 0.28",
    "platformdirs >= 4.0",
]

[tool.ruff]
line-length = 100

[tool.mypy]
strict = true
disallow_untyped_defs = true
ignore_missing_imports = false

[tool.pytest.ini_options]
testpaths = ["tests"]
