[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "steel-horizons-client"
version = "0.1.0"
description = "Minimal Python client for the Steel Horizons engine REST API"
requires-python = ">=3.10"
dependencies = [
    "httpx >= 0.28",
    "pydantic >= 2.0",
]
